apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegis-deploy-platform-ingress
  namespace: production
  labels:
    app: aegis-deploy-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/limit-rps: "250"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - deploy.aegisdeploy.io
      secretName: aegisdeploy-tls-secret
  rules:
    - host: deploy.aegisdeploy.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegis-deploy-platform-svc
                port:
                  number: 80
