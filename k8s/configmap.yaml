apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-platform-config
  namespace: production
  labels:
    app: aegis-deploy-platform
data:
  NODE_ENV: "production"
  PORT: "3000"
  EXECUTION_MODE: "hybrid"
  DOCKER_REGISTRY: "ghcr.io/devops-platform"
  K8S_NAMESPACE: "production"
  K8S_CLUSTER: "eks-us-east-1-prod"
  PROMETHEUS_URL: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
  GRAFANA_URL: "https://grafana.aegisdeploy.io"
  LOG_MAX_BUFFER: "1000"
