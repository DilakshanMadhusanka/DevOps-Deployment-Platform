apiVersion: v1
kind: Service
metadata:
  name: aegis-deploy-platform-svc
  namespace: production
  labels:
    app: aegis-deploy-platform
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: aegis-deploy-platform
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
