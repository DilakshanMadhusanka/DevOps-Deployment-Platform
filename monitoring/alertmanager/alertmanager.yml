global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h
  receiver: 'aegis-control-plane-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'aegis-control-plane-webhook'
      continue: true

receivers:
  - name: 'aegis-control-plane-webhook'
    webhook_configs:
      - url: 'http://aegis-platform:3000/api/alerts/simulate'
        send_resolved: true
