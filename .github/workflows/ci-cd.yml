name: Production CI/CD — Build, Test, Scan, Publish & K8s Rollout

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Kubernetes Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      force_rollback:
        description: 'Trigger immediate rollback to previous revision'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  K8S_NAMESPACE: production
  DEPLOYMENT_NAME: aegis-deploy-platform

jobs:
  # ==========================================================================
  # STAGE 1 & 2: Static Analysis, Linting, Unit & Integration Tests
  # ==========================================================================
  build-and-test:
    name: Automated Lint, Build & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Deterministic Dependencies
        run: npm ci

      - name: Run Static Syntax & Lint Verification
        run: npm run lint

      - name: Execute Automated Unit & API Integration Tests
        env:
          NODE_ENV: test
        run: npm test

  # ==========================================================================
  # STAGE 3 & 4: Multi-Stage Docker Build, Trivy CVE Scan & GHCR Publish
  # ==========================================================================
  docker-build-and-publish:
    name: Docker Buildx, Trivy Scan & Registry Push
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up QEMU Multi-Arch Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & OCI Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Multi-Stage Container Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Aqua Trivy Container Vulnerability Scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================================================
  # STAGE 5: Kubernetes Rolling Update, Health Checks & Automated Rollback
  # ==========================================================================
  kubernetes-deploy:
    name: Kubernetes Rolling Update & Health Verification
    needs: docker-build-and-publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment || 'production' }}
      url: https://deploy.aegisdeploy.io
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configure Kubernetes Cluster Context
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            mkdir -p $HOME/.kube
            echo "$KUBE_CONFIG_DATA" | base64 -d > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
          else
            echo "No KUBE_CONFIG_DATA secret configured; validating manifests in dry-run mode."
          fi

      - name: Apply Kubernetes Namespace, ConfigMap, Deployment, Service, HPA & Ingress
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          IMAGE_URI: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build-and-publish.outputs.image_digest }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/configmap.yaml
            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml
            kubectl apply -f k8s/hpa.yaml
            kubectl apply -f k8s/pdb.yaml
            kubectl apply -f k8s/ingress.yaml

            # Trigger zero-downtime RollingUpdate with immutable digest
            kubectl -n ${{ env.K8S_NAMESPACE }} set image deployment/${{ env.DEPLOYMENT_NAME }} \
              aegis-deploy-platform=${IMAGE_URI} --record

            # Wait for readiness/liveness probes to pass across all surge replicas
            if ! kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=180s; then
              echo "::error::RollingUpdate failed readiness probes! Executing automatic rollback..."
              kubectl -n ${{ env.K8S_NAMESPACE }} rollout undo deployment/${{ env.DEPLOYMENT_NAME }}
              kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=120s
              exit 1
            fi
          else
            echo "Validated k8s manifests for ${IMAGE_URI}"
          fi
